# The agent runs in a tmux session so the app can detach and reattach freely.
set -g status off
set -g escape-time 0
set -g history-limit 100000
set -g mouse on
# Wheel scrolling enters copy mode and moves through the history one line per event; the
# app sends one event per line of scrolling, so trackpads scroll smoothly. Scrolling back
# to the bottom leaves copy mode (copy-mode -e, tmux's default for the wheel).
bind -T copy-mode WheelUpPane send -X scroll-up
bind -T copy-mode WheelDownPane send -X scroll-down
bind -T copy-mode-vi WheelUpPane send -X scroll-up
bind -T copy-mode-vi WheelDownPane send -X scroll-down
set -g default-terminal "tmux-256color"
set -g extended-keys on
set -as terminal-features ",xterm-256color:RGB:extkeys:clipboard"
# Programs (and tmux copy mode) can set the Mac clipboard with OSC 52; the app copies it.
set -g set-clipboard on
set -g default-shell /bin/zsh
